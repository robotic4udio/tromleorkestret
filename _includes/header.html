<header class="site-header{% if include.over_hero %} site-header--over-hero{% endif %}" data-header>
  <div class="site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.data.settings.title }} – home">
      Tromle<span>orkestret</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.settings.menu-items %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      <a class="btn btn--fire site-nav__cta" href="{{ '/contact/' | relative_url }}">Book us</a>
    </nav>

    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
