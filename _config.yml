#-------------------------------
# General Site Settings
baseurl: "" # The subpath of your site, e.g. /blog
url: "https://tromleorkestret.com" # The base hostname & protocol for your site, e.g. http://example.com


#-------------------------------
# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# The instruments of the machine live in _instruments/ and are published under /the-machine/<name>/
collections:
  instruments:
    output: true
    permalink: /the-machine/:name/

defaults:
  - scope:
      path: '_pages'
    values:
      layout: page
  - scope:
      path: ''
      type: instruments
    values:
      layout: instrument

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _posts_tutorial
